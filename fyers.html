<!DOCTYPE html>
<html>
<head>
  <style>
    .container { position: relative; width: 100%; height: 800px; }
    iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0.05;
      z-index: 1; border: none;
    }
    .bait { position: relative; z-index: 2; margin-top: 300px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; background: #22c55e; border: none; cursor: pointer; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <iframe src="https://fyers.in/"></iframe>
    <div class="bait">
      <button>Click here to continue</button>
    </div>
  </div>
</body>
</html>
