<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDOR Testing Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #0f0f18;
  --bg3: #141420;
  --surface: #1a1a2e;
  --surface2: #1f1f35;
  --border: rgba(120,120,255,0.12);
  --border2: rgba(120,120,255,0.25);
  --accent: #6c63ff;
  --accent2: #ff6584;
  --accent3: #43e97b;
  --accent4: #f9c74f;
  --accent5: #f72585;
  --text: #e8e8f0;
  --text2: #9090b0;
  --text3: #5a5a7a;
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
  --red: #ff4d6d;
  --amber: #f9c74f;
  --green: #43e97b;
  --blue: #4cc9f0;
  --purple: #7b5ea7;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow-x: hidden;
  min-height: 100vh;
}

/* === CANVAS BG === */
#bg-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0; pointer-events: none; opacity: 0.35;
}

/* === LAYOUT === */
.page { position: relative; z-index: 1; }

/* === HERO === */
.hero {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 2rem;
  position: relative;
}
.hero-badge {
  font-family: var(--mono); font-size: 11px; letter-spacing: 3px;
  color: var(--accent); border: 1px solid var(--accent);
  padding: 4px 14px; border-radius: 99px; margin-bottom: 1.5rem;
  text-transform: uppercase; animation: fadeInDown 0.8s ease;
}
.hero h1 {
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  font-weight: 800; line-height: 1.05;
  background: linear-gradient(135deg, #fff 0%, #c8c8ff 40%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 1rem;
  animation: fadeInUp 0.9s ease 0.1s both;
}
.hero-sub {
  font-size: 1.1rem; color: var(--text2); max-width: 560px;
  line-height: 1.7; margin-bottom: 2.5rem;
  animation: fadeInUp 0.9s ease 0.2s both;
}
.hero-stats {
  display: flex; gap: 2.5rem; animation: fadeInUp 0.9s ease 0.3s both;
}
.hero-stat { text-align: center; }
.hero-stat .num { font-size: 2rem; font-weight: 800; color: var(--accent); line-height: 1; }
.hero-stat .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--text3); margin-top: 4px; text-transform: uppercase; }
.scroll-hint {
  position: absolute; bottom: 2rem;
  font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: 2px;
  animation: bounce 2s infinite;
}

/* === PHASE NAV === */
.phase-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,15,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem; overflow-x: auto;
}
.phase-nav-inner {
  display: flex; gap: 0; max-width: 1200px; margin: 0 auto;
}
.phase-nav-btn {
  flex-shrink: 0;
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  color: var(--text3); background: none; border: none;
  padding: 14px 18px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s; text-transform: uppercase; white-space: nowrap;
}
.phase-nav-btn:hover { color: var(--text); }
.phase-nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* === MAIN === */
.main { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem 6rem; }

/* === PHASE SECTION === */
.phase-section { margin-bottom: 4rem; scroll-margin-top: 60px; }
.phase-header {
  display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
}
.phase-number {
  font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
  color: var(--accent); background: rgba(108,99,255,0.12);
  border: 1px solid rgba(108,99,255,0.3);
  padding: 3px 10px; border-radius: 4px; flex-shrink: 0;
}
.phase-title {
  font-size: 1.6rem; font-weight: 700; color: var(--text);
}
.phase-tag {
  margin-left: auto; flex-shrink: 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
  padding: 3px 10px; border-radius: 99px; text-transform: uppercase;
}
.tag-critical { background: rgba(255,77,109,0.15); color: var(--red); border: 1px solid rgba(255,77,109,0.3); }
.tag-attack { background: rgba(255,101,132,0.12); color: var(--accent2); border: 1px solid rgba(255,101,132,0.3); }
.tag-bypass { background: rgba(249,199,79,0.12); color: var(--amber); border: 1px solid rgba(249,199,79,0.3); }
.tag-advanced { background: rgba(76,201,240,0.12); color: var(--blue); border: 1px solid rgba(76,201,240,0.3); }
.tag-recon { background: rgba(67,233,123,0.12); color: var(--green); border: 1px solid rgba(67,233,123,0.3); }
.tag-automation { background: rgba(123,94,167,0.12); color: #b39ddb; border: 1px solid rgba(123,94,167,0.3); }

/* === TECHNIQUE CARDS GRID === */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1rem;
}
.technique-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  cursor: pointer;
  position: relative;
}
.technique-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-accent, var(--accent));
  opacity: 0; transition: opacity 0.2s;
}
.technique-card:hover {
  transform: translateY(-3px);
  border-color: var(--border2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px var(--border2);
}
.technique-card:hover::before { opacity: 1; }
.technique-card.open { border-color: var(--border2); }
.technique-card.open::before { opacity: 1; }

.card-head {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 10px;
}
.card-risk {
  font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
  padding: 2px 8px; border-radius: 99px; flex-shrink: 0; text-transform: uppercase;
}
.risk-critical { background: rgba(255,77,109,0.2); color: var(--red); }
.risk-high { background: rgba(255,150,77,0.2); color: #ff964d; }
.risk-medium { background: rgba(249,199,79,0.2); color: var(--amber); }
.risk-low { background: rgba(67,233,123,0.2); color: var(--green); }
.risk-info { background: rgba(76,201,240,0.2); color: var(--blue); }

.card-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.3; }
.card-toggle {
  font-family: var(--mono); font-size: 16px; color: var(--text3);
  transition: transform 0.25s; flex-shrink: 0;
}
.technique-card.open .card-toggle { transform: rotate(45deg); color: var(--accent); }

.card-body {
  display: none; padding: 0 16px 16px;
  border-top: 1px solid var(--border);
}
.technique-card.open .card-body { display: block; }
.card-desc {
  font-size: 13px; color: var(--text2); line-height: 1.65;
  padding-top: 12px; margin-bottom: 10px;
}
.card-code {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
  font-family: var(--mono); font-size: 11px;
  color: #a8c7ff; line-height: 1.7;
  white-space: pre; overflow-x: auto;
}
.code-comment { color: var(--text3); }
.code-method { color: #f9c74f; }
.code-path { color: #a8c7ff; }
.code-highlight { color: #ff6584; }
.code-arrow { color: var(--accent3); }

/* === PAYLOAD TABLE === */
.payload-table {
  width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px;
}
.payload-table th {
  text-align: left; padding: 8px 12px;
  color: var(--text3); font-weight: 400; letter-spacing: 1px;
  border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase;
}
.payload-table td {
  padding: 8px 12px; border-bottom: 1px solid rgba(120,120,255,0.06);
  color: var(--text2); font-size: 11px; vertical-align: top;
}
.payload-table tr:hover td { background: rgba(108,99,255,0.05); }
.payload-table td:first-child { color: #f9c74f; white-space: nowrap; }
.payload-table td:last-child { color: #a8c7ff; }

/* === CHECKLIST === */
.checklist { list-style: none; }
.checklist li {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; color: var(--text2); line-height: 1.5;
}
.checklist li:last-child { border-bottom: none; }
.checklist li::before {
  content: '□'; font-size: 16px; color: var(--accent); flex-shrink: 0; line-height: 1.3;
}
input[type=checkbox]:checked + span { text-decoration: line-through; color: var(--text3); }

/* === PRIORITY GUIDE === */
.priority-list { list-style: none; }
.priority-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; margin-bottom: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; font-size: 14px;
  transition: border-color 0.15s, transform 0.15s;
}
.priority-item:hover { border-color: var(--border2); transform: translateX(4px); }
.priority-rank {
  font-family: var(--mono); font-size: 20px; font-weight: 700;
  min-width: 32px; text-align: center;
}
.p1 { color: var(--red); }
.p2 { color: #ff964d; }
.p3 { color: var(--amber); }
.p4 { color: #c8f; }
.p5 { color: var(--blue); }
.p6 { color: var(--green); }

/* === TOOL CARDS === */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.tool-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1rem 1.25rem;
}
.tool-name { font-size: 15px; font-weight: 700; color: var(--accent3); margin-bottom: 6px; font-family: var(--mono); }
.tool-desc { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }
.tool-cmd { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 11px; color: #a8c7ff; overflow-x: auto; white-space: pre; }

/* === INFO BOX === */
.info-box {
  background: rgba(108,99,255,0.08); border: 1px solid rgba(108,99,255,0.25);
  border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem;
  font-size: 13px; color: var(--text2); line-height: 1.6;
}
.info-box strong { color: var(--accent); }

/* === SECTION DIVIDER === */
.divider {
  border: none; border-top: 1px solid var(--border);
  margin: 3rem 0;
}

/* === ANIMATIONS === */
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

/* === SCROLLBAR === */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }

/* === ADDITIONAL METHOD BADGE === */
.new-badge {
  font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
  background: rgba(247,37,133,0.2); color: #f72585;
  border: 1px solid rgba(247,37,133,0.3); border-radius: 99px;
  padding: 1px 7px; text-transform: uppercase; margin-left: 6px; vertical-align: middle;
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="page">

<!-- HERO -->
<section class="hero">
  <div class="hero-badge">Security Research Guide</div>
  <h1>IDOR Testing<br>Masterclass</h1>
  <p class="hero-sub">Insecure Direct Object Reference vulnerabilities — a complete field guide for ethical security researchers. 12 phases, 80+ techniques.</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">12</div><div class="lbl">Phases</div></div>
    <div class="hero-stat"><div class="num">80+</div><div class="lbl">Techniques</div></div>
    <div class="hero-stat"><div class="num">20+</div><div class="lbl">Payloads</div></div>
    <div class="hero-stat"><div class="num">6</div><div class="lbl">Tools</div></div>
  </div>
  <div class="scroll-hint">▼ scroll to explore</div>
</section>

<!-- PHASE NAV -->
<nav class="phase-nav" id="phaseNav">
  <div class="phase-nav-inner" id="phaseNavInner"></div>
</nav>

<!-- MAIN CONTENT -->
<main class="main" id="mainContent"></main>

</div>

<script>
// ===================== DATA =====================
const phases = [
  {
    id: 1, label: "Setup", fullLabel: "Setup & Target ID",
    tag: "Recon", tagClass: "tag-recon",
    info: "Before any testing, establish proper lab setup. Always use dedicated test accounts — never test on real users.",
    techniques: [
      { title: "Create attacker & victim accounts", risk: "critical", riskLabel: "Critical",
        desc: "Create two separate accounts: one as the 'Attacker' (yours) and one as the 'Victim'. Essential for safely testing destructive operations (POST/PUT/DELETE) without impacting real users.",
        code: `# Example\nAttacker: attacker@pentest.local  (ID=10)\nVictim:   victim@pentest.local    (ID=9)\n\n# Never use real accounts — always isolated test env` },
      { title: "Identify JSON API endpoints", risk: "high", riskLabel: "High",
        desc: "Target JSON REST API endpoints instead of HTML-rendered pages. APIs expose raw object IDs in URLs, query params, and request bodies — making IDOR much easier to exploit.",
        code: `# Prefer API endpoints:\nGET /api/v1/users/10\nGET /api/v2/orders/4321\n\n# Not rendered HTML (harder):\nGET /dashboard/profile` },
      { title: "Sensitivity analysis — prioritize targets", risk: "critical", riskLabel: "Critical",
        desc: "Rank endpoints by impact: password reset > financial data > DMs > account recovery > user management > public data.",
        code: `# High value targets first:\nPOST /api/reset-password\nGET  /api/invoice/{id}\nGET  /api/messages/{id}\nDEL  /api/account/{id}` },
      { title: "ID parameter audit", risk: "medium", riskLabel: "Medium",
        desc: "Hunt for ID parameters in all layers — URL path, query string, JSON body, cookies, headers.",
        code: `# Check everywhere:\nPath:    /users/{id}\nQuery:   ?user_id=10\nBody:    {"userId": 10}\nCookie:  session_user=10\nHeader:  X-User-ID: 10` },
      { title: "Find leaked IDs", risk: "high", riskLabel: "High",
        desc: "IDs often leak from public pages, API responses, emails, Swagger docs, and referrer headers.",
        code: `# Sources of leaked IDs:\n- Public profile: /u/victim_name\n- API field: {"created_by": 9}\n- Email receipt: order_id=9999\n- Swagger: GET /api-docs\n- JS source files` },
      { title: "Map all clients", risk: "medium", riskLabel: "Medium",
        desc: "Decompile mobile apps with jadx/apktool to find hidden API endpoints. Check Swagger/OpenAPI specs. Mobile apps often expose endpoints the web UI hides.",
        code: `# Tools:\njadx app.apk            # decompile Android\napktool d app.apk        # decode resources\nburp + mobile proxy      # intercept traffic\ncurl /swagger.json       # API spec` },
    ]
  },
  {
    id: 2, label: "Direct ID", fullLabel: "Direct ID Substitution",
    tag: "Attack", tagClass: "tag-attack",
    info: "The most fundamental IDOR technique — directly swap your ID for a victim's ID. Always start here before complex techniques.",
    techniques: [
      { title: "Basic ID flip", risk: "critical", riskLabel: "Critical",
        desc: "The simplest IDOR test: replace your own ID with another user's ID in the URL path.",
        code: `GET /api/v5/users/10   # your account\n           ↓\nGET /api/v5/users/9    # victim's account` },
      { title: "Incremental numeric brute force", risk: "critical", riskLabel: "Critical",
        desc: "Sequentially enumerate IDs by incrementing/decrementing from your own. Works against predictable integer-based IDs.",
        code: `# Python snippet\nfor uid in range(1, 10000):\n    r = requests.get(\n        f"/api/user/{uid}",\n        headers={"Authorization": token}\n    )\n    if r.status_code == 200:\n        exfiltrate(r.json())` },
      { title: "Non-numeric ID substitution", risk: "high", riskLabel: "High",
        desc: "Replace numeric ID with email address, username, or UUID. Some APIs accept multiple identifier formats.",
        code: `GET /api/users/10\n  → GET /api/users/victim@email.com\n  → GET /api/users/victim_username\n  → GET /api/users/uuid-abc-123` },
      { title: "Complex ID brute force", risk: "medium", riskLabel: "Medium",
        desc: "Brute force only the last 1–4 chars of a short alphanumeric ID segment.",
        code: `# ID pattern: user_XXXX\n# Brute last 4 chars:\nuser_a3f0 ... user_a3fz\nuser_b0a0 ... user_b0az\n\n# Tool: ffuf with charset wordlist` },
      { title: "Predictable / combined IDs", risk: "medium", riskLabel: "Medium",
        desc: "When paths contain multiple IDs, change one or both. Check if each part is independently validated.",
        code: `# Original\n/user/2222/data/3333\n# Tests:\n/user/2222/data/1111  # change resource ID\n/user/9999/data/3333  # change user ID\n/user/9999/data/1111  # change both` },
      { title: "Hashed / derived IDs", risk: "medium", riskLabel: "Medium",
        desc: "Detect MD5/SHA-based IDs by creating multiple accounts and observing patterns. Map your IDs to derive victim hashes.",
        code: `# Observation\nAccount 1: id = md5("user1@x.com")\nAccount 2: id = md5("user2@x.com")\n# Derive:\nVictim hash = md5("victim@x.com")` },
    ]
  },
  {
    id: 3, label: "URL Bypass", fullLabel: "Path & URL Manipulation",
    tag: "Bypass", tagClass: "tag-bypass",
    info: "Manipulate URL structure to bypass authorization checks that rely on exact path matching.",
    techniques: [
      { title: "Trailing slash bypass", risk: "medium", riskLabel: "Medium",
        desc: "Some WAFs and auth layers match exact paths. Adding a trailing slash may route to a different handler that skips the auth check.",
        code: `GET /api/v5/users/9\n          ↓\nGET /api/v5/users/9/` },
      { title: "Double slash / obfuscated path", risk: "medium", riskLabel: "Medium",
        desc: "Double slashes or dot segments can confuse path normalization, routing around auth middleware.",
        code: `GET /api/v5/users//9\nGET /api/v5/users/./9\nGET /api/v5/users/%2F9\nGET /api//v5//users//9` },
      { title: "Case variation / key swapping", risk: "medium", riskLabel: "Medium",
        desc: "Case-sensitive routing can bypass case-insensitive auth checks. Also swap parameter names (user_id ↔ userid ↔ uid).",
        code: `# Case variation\nGET /api/User?id=123\nGET /api/USER?id=123\n\n# Param name swapping\n?user_id=9  →  ?userid=9\n?uid=9      →  ?account_id=9` },
      { title: "Path traversal in ID position", risk: "high", riskLabel: "High",
        desc: "Use ../ to escape your authorized resource scope and reach a victim's resource.",
        code: `POST /users/delete/10/../9\nPOST /files/10/../../9/secret\nGET  /data/my_id/../../victim_id` },
      { title: "Wildcard substitution", risk: "low", riskLabel: "Low",
        desc: "Replace ID with wildcard characters to see if the server returns all records.",
        code: `GET /api/users/*\nGET /api/users/_\nGET /api/users/%\nGET /api/users/null\nGET /api/users/undefined` },
      { title: "Fuzz keywords in path", risk: "medium", riskLabel: "Medium",
        desc: "Replace numeric ID with keywords — some endpoints have undocumented mass-access routes.",
        code: `GET /api/v3/users/12345\n  → /api/v3/users/all\n  → /api/v3/users/list\n  → /api/v3/users/export\n  → /api/v3/users/admin` },
      { title: "SQLi quick check", risk: "medium", riskLabel: "Medium",
        desc: "Append a single quote to the ID — if the app is vulnerable to SQLi, it may return errors or all records.",
        code: `GET /api/v3/users/12345'\nGET /api/v3/users/12345 OR 1=1--\nGET /api/v3/users/12345' UNION SELECT *--` },
    ]
  },
  {
    id: 4, label: "Logic Bypass", fullLabel: "Logic & Endpoint Bypasses",
    tag: "Bypass", tagClass: "tag-bypass",
    info: "Target application logic flaws — where authorization checks exist but can be sidestepped through version differences, token swaps, or frontend/backend desync.",
    techniques: [
      { title: "API version downgrading", risk: "high", riskLabel: "High",
        desc: "Older API versions often have weaker or missing auth checks. Downgrade from v3 to v1.",
        code: `GET /v3/user/111   # secured\n         ↓\nGET /v1/user/111   # older, weaker\nGET /v2/user/111   # middle version` },
      { title: "Sub-endpoint variant", risk: "high", riskLabel: "High",
        desc: "Full-profile endpoints may be protected, but detail sub-endpoints may not be independently authorized.",
        code: `GET /api/user/9           # protected\n\n# Try sub-endpoints:\nGET /api/user/9/email\nGET /api/user/9/phone\nGET /api/user/9/address` },
      { title: "Missing function-level access control", risk: "high", riskLabel: "High",
        desc: "Frontend hides admin routes — but backend may accept them. Try accessing admin endpoints with a normal user token.",
        code: `# Admin endpoints accessible to normal users:\nGET /admin/users\nGET /Admin/users       # case bypass\nGET /ADMIN/users\nGET /manage/users\nGET /internal/users` },
      { title: "Owner flag / role field toggle", risk: "critical", riskLabel: "Critical",
        desc: "Look for is_admin, owner, role fields in API responses. Try sending those fields in your request to escalate privileges.",
        code: `# Server response contains:\n{"user_id":10, "is_admin": false}\n\n# Attack: send is_admin=true in body\nPUT /api/profile\nBody: {"is_admin": true, "role": "admin"}` },
      { title: "Token / authorization swap", risk: "critical", riskLabel: "Critical",
        desc: "Swap your Bearer token with the victim's token, or test if an API key from one account authorizes actions on another.",

// ===================== 3D PARTICLE CANVAS =====================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.z = Math.random() * 2 + 0.2;
    this.vx = (Math.random() - 0.5) * 0.3 * this.z;
    this.vy = (Math.random() - 0.5) * 0.3 * this.z;
    this.r = Math.random() * 1.5 + 0.4;
    this.color = ['#6c63ff','#ff6584','#43e97b','#4cc9f0','#f9c74f'][Math.floor(Math.random()*5)];
    this.alpha = Math.random() * 0.6 + 0.1;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
  }
  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.z, 0, Math.PI * 2);
    ctx.fill();
  }
}

particles = Array.from({ length: 180 }, () => new Particle());

function drawConnections() {
  const maxDist = 100;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < maxDist) {
        ctx.globalAlpha = (1 - d/maxDist) * 0.08;
        ctx.strokeStyle = '#6c63ff';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawConnections();
  particles.forEach(p => { p.update(); p.draw(); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
