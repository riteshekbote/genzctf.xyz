<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SubEnum Live · real subdomain discovery (frontend)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1120;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', monospace;
            padding: 1.5rem;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.7rem;
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: normal;
            color: #94a3b8;
        }

        .card {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        input {
            flex: 2;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.8rem 1.2rem;
            border-radius: 2rem;
            font-size: 1rem;
            color: #f1f5f9;
            font-family: monospace;
        }

        button {
            background: #3b82f6;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #2563eb; transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        select, .search-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: #e2e8f0;
        }

        .info-msg {
            background: #0f172a;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-top: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.9rem 0.8rem;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
            font-weight: 500;
        }

        .risk-high { background: #7f1a1a20; color: #fca5a5; border-left: 3px solid #ef4444; }
        .risk-medium { background: #854d0e20; color: #fde047; border-left: 3px solid #eab308; }
        .risk-low { color: #86efac; }

        .copy-btn {
            background: #334155;
            border: none;
            padding: 0.2rem 0.7rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            cursor: pointer;
            color: white;
        }

        .status-badge {
            font-family: monospace;
            font-weight: bold;
        }

        .progress-bar {
            height: 4px;
            background: #3b82f6;
            width: 0%;
            transition: width 0.2s;
            border-radius: 4px;
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            td, th { font-size: 0.75rem; padding: 0.6rem 0.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🔍 SubEnum · Live
        <span class="badge">real subdomains · CORS proxy</span>
    </h1>
    <div class="card">
        <div class="input-group">
            <input type="text" id="domain" placeholder="example.com" value="example.com">
            <button id="startBtn">🚀 Start Real Scan</button>
        </div>
        <div class="info-msg" id="statusMsg">⚡ Ready — enter a domain. Uses crt.sh + bufferover + HTTP probing via CORS proxy.</div>
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="card">
        <div class="filters">
            <input type="text" id="searchFilter" placeholder="🔎 filter subdomain..." class="search-box">
            <select id="statusFilter">
                <option value="all">All status</option>
                <option value="2xx">✅ 2xx</option>
                <option value="3xx">↪️ 3xx</option>
                <option value="4xx">⚠️ 4xx</option>
                <option value="5xx">🔥 5xx</option>
                <option value="error">❌ No response</option>
            </select>
            <select id="riskFilter">
                <option value="all">All risks</option>
                <option value="high">🔴 High (admin/api/auth)</option>
                <option value="medium">🟡 Medium (dev/test/staging)</option>
                <option value="low">🟢 Low</option>
            </select>
            <span id="resultCount">0 results</span>
            <button id="exportBtn" class="copy-btn" style="margin-left: auto;">📎 Export JSON</button>
        </div>
        <div style="overflow-x: auto;">
            <table id="resultsTable">
                <thead>
                    <tr><th>Subdomain</th><th>Status</th><th>Title</th><th>Server</th><th>Risk</th><th>Copy</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="6" style="text-align:center">✨ Click Start to enumerate live subdomains</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ------------------- CONFIG -------------------
    const CORS_PROXY = "https://corsproxy.io/?";  // free, no API key
    const MAX_CONCURRENT_PROBES = 8;              // respect rate limits
    let currentResults = [];
    let isScanning = false;
    let abortController = null;

    // DOM elements
    const domainInput = document.getElementById('domain');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('statusMsg');
    const progressBar = document.getElementById('progressBar');
    const searchFilter = document.getElementById('searchFilter');
    const statusFilter = document.getElementById('statusFilter');
    const riskFilter = document.getElementById('riskFilter');
    const resultCountSpan = document.getElementById('resultCount');
    const tableBody = document.getElementById('tableBody');
    const exportBtn = document.getElementById('exportBtn');

    // ------------------- Helper: Risk detection -------------------
    function getRisk(subdomain) {
        const name = subdomain.split('.')[0].toLowerCase();
        const highSet = new Set(['admin', 'api', 'auth', 'internal', 'portal', 'dashboard', 'vpn', 'secure', 'console', 'manage']);
        const mediumSet = new Set(['dev', 'test', 'staging', 'uat', 'qa', 'beta', 'stage', 'demo', 'sandbox']);
        if (highSet.has(name)) return 'high';
        if (mediumSet.has(name) || Array.from(mediumSet).some(k => name.includes(k))) return 'medium';
        return 'low';
    }

    // ------------------- SOURCE 1: crt.sh (CORS enabled) -------------------
    async function fetchCrtsh(domain) {
        const url = `https://crt.sh/?q=%25.${domain}&output=json`;
        try {
            const resp = await fetch(url);
            if (!resp.ok) return new Set();
            const data = await resp.json();
            const subs = new Set();
            for (let entry of data) {
                let name = entry.name_value;
                if (name) {
                    for (let part of name.split('\n')) {
                        part = part.trim().toLowerCase();
                        if (part.endsWith(`.${domain}`) && !part.startsWith('*.') && !part.includes(' ')) {
                            subs.add(part);
                        }
                    }
                }
            }
            return subs;
        } catch (e) {
            console.warn("crt.sh error", e);
            return new Set();
        }
    }

    // ------------------- SOURCE 2: bufferover.run (CORS friendly) -------------------
    async function fetchBufferover(domain) {
        const url = `https://dns.bufferover.run/dns?q=.${domain}`;
        try {
            const resp = await fetch(url);
            if (!resp.ok) return new Set();
            const data = await resp.json();
            const subs = new Set();
            // results in FDNS_A or RDNS
            const records = data.FDNS_A || [];
            for (let record of records) {
                const parts = record.split(',');
                const sub = parts[1]?.toLowerCase();
                if (sub && sub.endsWith(`.${domain}`) && !sub.startsWith('*')) {
                    subs.add(sub);
                }
            }
            return subs;
        } catch (e) {
            console.warn("bufferover error", e);
            return new Set();
        }
    }

    // ------------------- combine subdomains -------------------
    async function getAllSubdomains(domain) {
        statusDiv.innerText = `🔍 Fetching subdomains from crt.sh & bufferover...`;
        const [crtSet, bufSet] = await Promise.all([fetchCrtsh(domain), fetchBufferover(domain)]);
        const combined = new Set([...crtSet, ...bufSet]);
        return Array.from(combined).sort();
    }

    // ------------------- HTTP Probe via CORS proxy -------------------
    async function probeSubdomain(subdomain, semaphore) {
        await semaphore.acquire();
        try {
            // try https first, then http
            for (const scheme of ['https', 'http']) {
                const targetUrl = `${scheme}://${subdomain}`;
                const proxyUrl = CORS_PROXY + encodeURIComponent(targetUrl);
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 7000);
                    const resp = await fetch(proxyUrl, {
                        signal: controller.signal,
                        headers: { 'X-Requested-With': 'SubEnum' }
                    });
                    clearTimeout(timeoutId);
                    const status = resp.status;
                    if (status === 0) continue;
                    // get title from HTML (limited)
                    let html = '';
                    try {
                        html = await resp.text();
                    } catch (e) {}
                    let title = '-';
                    const titleMatch = html.match(/<title[^>]*>([^<]*)<\/title>/i);
                    if (titleMatch) title = titleMatch[1].trim().slice(0, 100);
                    const server = resp.headers.get('server') || '-';
                    return {
                        subdomain,
                        status,
                        title: title || '-',
                        server: server.slice(0, 60),
                        risk: getRisk(subdomain),
                        url: targetUrl
                    };
                } catch (err) {
                    // try next scheme
                    continue;
                }
            }
            // if both fail
            return null;
        } finally {
            semaphore.release();
        }
    }

    // Semaphore for concurrency control
    class Semaphore {
        constructor(max) { this.max = max; this.count = 0; this.waiting = []; }
        acquire() {
            return new Promise((resolve) => {
                if (this.count < this.max) {
                    this.count++;
                    resolve();
                } else {
                    this.waiting.push(resolve);
                }
            });
        }
        release() {
            if (this.waiting.length > 0) {
                const next = this.waiting.shift();
                next();
            } else {
                this.count--;
            }
        }
    }

    // ------------------- Main scan -------------------
    async function startScan() {
        if (isScanning) {
            if (abortController) abortController.abort();
            return;
        }
        const domain = domainInput.value.trim();
        if (!domain) {
            alert("Enter a domain (e.g. example.com)");
            return;
        }
        isScanning = true;
        abortController = new AbortController();
        startBtn.textContent = "⏹️ Stop Scan";
        currentResults = [];
        renderTable();
        progressBar.style.width = "0%";

        try {
            // 1. collect subdomains
            const subdomains = await getAllSubdomains(domain);
            if (subdomains.length === 0) {
                statusDiv.innerText = `⚠️ No subdomains found via crt.sh/bufferover for ${domain}. Try another domain.`;
                return;
            }
            statusDiv.innerText = `📡 Discovered ${subdomains.length} subdomains. Probing HTTP(s) via CORS proxy...`;

            const sem = new Semaphore(MAX_CONCURRENT_PROBES);
            let completed = 0;
            const total = subdomains.length;
            const probePromises = subdomains.map(async (sub) => {
                if (abortController.signal.aborted) return null;
                const result = await probeSubdomain(sub, sem);
                completed++;
                const percent = (completed / total) * 100;
                progressBar.style.width = `${percent}%`;
                if (result) {
                    currentResults.push(result);
                    renderTable();  // live update
                }
                return result;
            });
            await Promise.allSettled(probePromises);
            statusDiv.innerText = `✅ Scan finished. Found ${currentResults.length} live subdomains out of ${total} candidates.`;
        } catch (err) {
            statusDiv.innerText = `❌ Error: ${err.message}`;
        } finally {
            isScanning = false;
            startBtn.textContent = "🚀 Start Real Scan";
            progressBar.style.width = "100%";
            setTimeout(() => { progressBar.style.width = "0%"; }, 1000);
        }
    }

    // ------------------- Render table with filters -------------------
    function renderTable() {
        let filtered = [...currentResults];
        const search = searchFilter.value.toLowerCase();
        if (search) filtered = filtered.filter(r => r.subdomain.includes(search));
        const statusVal = statusFilter.value;
        if (statusVal !== 'all') {
            if (statusVal === 'error') filtered = filtered.filter(r => !r.status || r.status === 0);
            else {
                const digit = parseInt(statusVal[0]);
                filtered = filtered.filter(r => r.status && Math.floor(r.status / 100) === digit);
            }
        }
        const riskVal = riskFilter.value;
        if (riskVal !== 'all') filtered = filtered.filter(r => r.risk === riskVal);
        resultCountSpan.innerText = `${filtered.length} results`;
        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center">No matching subdomains</td></tr>`;
            return;
        }
        let html = '';
        for (let r of filtered) {
            let riskClass = r.risk === 'high' ? 'risk-high' : (r.risk === 'medium' ? 'risk-medium' : 'risk-low');
            let statusText = r.status ? r.status : '❌ timeout/refused';
            html += `<tr class="${riskClass}">
                <td><code>${escapeHtml(r.subdomain)}</code></td>
                <td class="status-badge">${statusText}</td>
                <td>${escapeHtml(r.title)}</td>
                <td>${escapeHtml(r.server)}</td>
                <td>${r.risk.toUpperCase()}</td>
                <td><button class="copy-btn" data-sub="${escapeHtml(r.subdomain)}">📋 Copy</button></td>
            </tr>`;
        }
        tableBody.innerHTML = html;
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const sub = btn.getAttribute('data-sub');
                navigator.clipboard.writeText(sub);
                btn.textContent = '✓ Copied!';
                setTimeout(() => btn.textContent = '📋 Copy', 1000);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Export JSON
    function exportJSON() {
        const dataStr = JSON.stringify(currentResults, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `subenum_${domainInput.value}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // Event listeners
    startBtn.addEventListener('click', startScan);
    searchFilter.addEventListener('input', renderTable);
    statusFilter.addEventListener('change', renderTable);
    riskFilter.addEventListener('change', renderTable);
    exportBtn.addEventListener('click', exportJSON);

    // initial dummy to show instructions
    renderTable();
</script>
</body>
</html>
