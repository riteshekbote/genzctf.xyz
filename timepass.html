<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Screen iFrame</title>

<style>
    /* Remove default margin */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }

    iframe {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;     /* full width */
        height: 100vh;    /* full height */
        border: none;
    }
</style>
</head>

<body>

<iframe src="https://www.backtrack-linux.org/"></iframe>

</body>
</html>
