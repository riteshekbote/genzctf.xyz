<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GenZCTF | Cyber Core — Advanced 3D Experience</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Orbitron', 'Inter', monospace;
            background-color: black;
        }
        /* UI overlay controls */
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 10px 18px;
            color: #0ff;
            font-family: monospace;
            font-size: 12px;
            border-left: 3px solid #0ff;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ccf;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
            border: 1px solid rgba(0,255,255,0.4);
        }
        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 0px cyan; }
            100% { opacity: 1; text-shadow: 0 0 10px cyan; }
        }
        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 100;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        @media (max-width: 700px) {
            .info-panel { font-size: 8px; padding: 6px 12px; }
            .controls-hint { font-size: 8px; }
        }
    </style>
</head>
<body>
    <div class="status">⚡ GENZCTF // CORE NEXUS ⚡</div>
    <div class="controls-hint">🖱️ DRAG to orbit • SCROLL to zoom • FULL 3D IMMERSION</div>
    <div class="info-panel">🔐 CYBER TASK FORCE • RITESH | NIDHI | MUJAHID 🔐</div>

    <!-- Import Three.js core and add-ons with post-processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- Setup Scene, Camera, Renderers ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.006);
        
        // Camera: dramatic perspective
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 3.5, 9);
        camera.lookAt(0, 0.5, 0);
        
        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // CSS2DRenderer for high-quality labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- Post Processing (Bloom & Glow) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.85;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --- Controls with auto-rotate and damping ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0.6, 0);
        
        // --- Dynamic Lighting System (Advanced) ---
        // Ambient with subtle color
        const ambient = new THREE.AmbientLight(0x111122);
        scene.add(ambient);
        
        // Main directional light with shadows
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(4, 6, 3);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 12;
        scene.add(mainLight);
        
        // Fill light (purple/blue)
        const fillLight = new THREE.PointLight(0x3366ff, 0.7);
        fillLight.position.set(-2, 1, 3);
        scene.add(fillLight);
        
        // Back rim light (hot pink)
        const rimLight = new THREE.PointLight(0xff44aa, 0.9);
        rimLight.position.set(1, 2, -4);
        scene.add(rimLight);
        
        // Dynamic color cycling lights
        const colorLightA = new THREE.PointLight(0xff00aa, 0.6);
        colorLightA.position.set(2.5, 1.2, 2);
        scene.add(colorLightA);
        
        const colorLightB = new THREE.PointLight(0x00ccff, 0.6);
        colorLightB.position.set(-2.2, 1.5, 2.8);
        scene.add(colorLightB);
        
        // Central core glow
        const coreGlow = new THREE.PointLight(0x33aaff, 1.2, 12);
        coreGlow.position.set(0, 0.3, 0);
        scene.add(coreGlow);
        
        // Ground grid with advanced reflective look
        const gridHelper = new THREE.GridHelper(18, 32, 0x33ccff, 0x2266aa);
        gridHelper.position.y = -1.4;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // Circular neon floor ring
        const ringFloorGeo = new THREE.RingGeometry(2.2, 4.8, 64);
        const ringFloorMat = new THREE.MeshStandardMaterial({
            color: 0x2288ff,
            emissive: 0x1166cc,
            emissiveIntensity: 0.4,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.5
        });
        const floorRing = new THREE.Mesh(ringFloorGeo, ringFloorMat);
        floorRing.rotation.x = -Math.PI / 2;
        floorRing.position.y = -1.35;
        scene.add(floorRing);
        
        // --- Central Artifact: Hyper Torus Knot + Crystal + Floating Runes ---
        const knotGeo = new THREE.TorusKnotGeometry(1.15, 0.28, 200, 32, 3, 4);
        const knotMat = new THREE.MeshStandardMaterial({
            color: 0x2a6eff,
            emissive: 0x1155aa,
            emissiveIntensity: 0.9,
            metalness: 0.9,
            roughness: 0.2,
            flatShading: false
        });
        const centralKnot = new THREE.Mesh(knotGeo, knotMat);
        centralKnot.castShadow = true;
        scene.add(centralKnot);
        
        // Inner diamond icosahedron
        const coreIcosa = new THREE.IcosahedronGeometry(0.68, 0);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            emissive: 0x2288ff,
            emissiveIntensity: 0.7,
            metalness: 0.8,
            roughness: 0.3,
            transparent: true
        });
        const innerCore = new THREE.Mesh(coreIcosa, coreMat);
        scene.add(innerCore);
        
        // Orbiting particles around center (energy swarm)
        const swarmCount = 800;
        const swarmGeo = new THREE.BufferGeometry();
        const swarmPositions = new Float32Array(swarmCount * 3);
        for (let i = 0; i < swarmCount; i++) {
            const radius = 1.7 + Math.random() * 0.6;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 1.2;
            swarmPositions[i*3] = Math.cos(angle) * radius;
            swarmPositions[i*3+1] = height;
            swarmPositions[i*3+2] = Math.sin(angle) * radius;
        }
        swarmGeo.setAttribute('position', new THREE.BufferAttribute(swarmPositions, 3));
        const swarmMat = new THREE.PointsMaterial({ color: 0x44ddff, size: 0.045, blending: THREE.AdditiveBlending });
        const swarmPoints = new THREE.Points(swarmGeo, swarmMat);
        scene.add(swarmPoints);
        
        // --- Advanced Particle Systems: Starfield + Nebula Dust ---
        const starCount = 2500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 180;
            starPos[i*3+1] = (Math.random() - 0.5) * 80;
            starPos[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.7 });
        const starsField = new THREE.Points(starGeo, starMat);
        scene.add(starsField);
        
        // Floating glowing dust particles
        const dustCount = 1800;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustColors = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPos[i*3] = (Math.random() - 0.5) * 12;
            dustPos[i*3+1] = (Math.random() - 0.5) * 5 + 0.5;
            dustPos[i*3+2] = (Math.random() - 0.5) * 12;
            const col = Math.random() > 0.6 ? new THREE.Color(0x88aaff) : new THREE.Color(0xff66cc);
            dustColors[i*3] = col.r;
            dustColors[i*3+1] = col.g;
            dustColors[i*3+2] = col.b;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));
        const dustMat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
        const dustCloud = new THREE.Points(dustGeo, dustMat);
        scene.add(dustCloud);
        
        // --- Advanced Feature: Floating Binary Runes (using CSS2D or sprites? Use canvas texture) ---
        // Create a ring of floating digits around center
        const runeGroup = new THREE.Group();
        const runeCount = 36;
        const runeTextures = [];
        for (let i = 0; i < runeCount; i++) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0ff';
            ctx.font = 'Bold 28px "Courier New"';
            ctx.fillStyle = '#0ff';
            ctx.shadowBlur = 0;
            ctx.fillText(Math.random() > 0.5 ? '1' : '0', 20, 42);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, color: 0x44ccff, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(spriteMat);
            const angle = (i / runeCount) * Math.PI * 2;
            const radius = 2.2;
            sprite.position.set(Math.cos(angle) * radius, Math.sin(angle * 2) * 0.3, Math.sin(angle) * radius);
            sprite.scale.set(0.35, 0.35, 1);
            runeGroup.add(sprite);
            runeTextures.push(texture);
        }
        scene.add(runeGroup);
        
        // --- Team Members: Advanced 3D with Halo Orbits and CSS2D Glass Cards ---
        const membersData = [
            { name: "Ritesh", role: "Captain • Reverse Engineering", color: 0x3a86ff, accent: "#3a86ff", posAngle: 0 },
            { name: "Nidhi", role: "Cryptography • Web Exploit", color: 0xff006e, accent: "#ff006e", posAngle: 120 },
            { name: "Mujahid", role: "Pwn • Forensics Master", color: 0xaa44ff, accent: "#b94eff", posAngle: 240 }
        ];
        
        const memberGroupRoot = new THREE.Group();
        scene.add(memberGroupRoot);
        
        const membersList = [];
        const radiusOrbit = 3.6;
        
        membersData.forEach((member, idx) => {
            const angleRad = (member.posAngle * Math.PI) / 180;
            const x = Math.cos(angleRad) * radiusOrbit;
            const z = Math.sin(angleRad) * radiusOrbit;
            
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            
            // Main sphere with glow effect
            const sphereGeo = new THREE.SphereGeometry(0.68, 96, 96);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: member.color,
                emissive: member.color,
                emissiveIntensity: 0.45,
                metalness: 0.85,
                roughness: 0.2,
                flatShading: false
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.castShadow = true;
            group.add(sphere);
            
            // Halo ring around each member
            const haloGeo = new THREE.TorusGeometry(0.85, 0.05, 64, 200);
            const haloMat = new THREE.MeshStandardMaterial({ color: member.color, emissive: member.color, emissiveIntensity: 0.7 });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            halo.rotation.x = Math.PI / 2;
            group.add(halo);
            
            // Second rotating ring
            const ring2Geo = new THREE.TorusGeometry(0.98, 0.03, 64, 200);
            const ring2Mat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: member.color, emissiveIntensity: 0.5 });
            const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
            ring2.rotation.z = Math.PI / 3;
            group.add(ring2);
            
            // CSS2D Label - glassmorphic advanced
            const div = document.createElement('div');
            div.style.background = `linear-gradient(135deg, rgba(10,20,40,0.85), rgba(0,0,0,0.7))`;
            div.style.backdropFilter = 'blur(14px)';
            div.style.borderRadius = '28px';
            div.style.padding = '12px 24px';
            div.style.border = `1px solid ${member.accent}`;
            div.style.boxShadow = `0 0 25px ${member.accent}80, 0 8px 20px black`;
            div.style.textAlign = 'center';
            div.style.fontFamily = "'Orbitron', 'Inter', monospace";
            div.style.transition = 'transform 0.2s';
            div.innerHTML = `
                <div style="font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #fff, ${member.accent}); background-clip: text; -webkit-background-clip: text; color: transparent;">${member.name}</div>
                <div style="font-size: 0.7rem; color: #ccf; letter-spacing: 2px; margin-top: 5px;">${member.role}</div>
                <div style="font-size: 0.6rem; color: ${member.accent}; margin-top: 6px;">⚡ GENZCTF CORE ⚡</div>
            `;
            const label = new CSS2DObject(div);
            label.position.set(0, 1.25, 0);
            group.add(label);
            
            memberGroupRoot.add(group);
            
            // store for animation
            membersList.push({ group, sphere, halo, ring2, angleOffset: idx, speed: 0.8 + idx * 0.2 });
        });
        
        // --- Extra: Flying Particles between members (energy threads) ---
        const lineParticles = [];
        const particleCountLines = 150;
        for (let i = 0; i < particleCountLines; i++) {
            const particleGeo = new THREE.SphereGeometry(0.045, 8, 8);
            const particleMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x2266aa, emissiveIntensity: 0.8 });
            const particle = new THREE.Mesh(particleGeo, particleMat);
            scene.add(particle);
            lineParticles.push(particle);
        }
        
        // --- Floating Digital Orbs (Advanced) ---
        const energyOrbs = [];
        for (let i = 0; i < 24; i++) {
            const orbGeo = new THREE.SphereGeometry(0.09, 16, 16);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0xff44aa, emissiveIntensity: 0.9 });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            scene.add(orb);
            energyOrbs.push(orb);
        }
        
        // --- Shimmering Ring (Advanced FX) ---
        const shimmerRingGeo = new THREE.TorusGeometry(1.45, 0.04, 128, 300);
        const shimmerMat = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x0088ff, emissiveIntensity: 1.0, transparent: true });
        const shimmerRing = new THREE.Mesh(shimmerRingGeo, shimmerMat);
        scene.add(shimmerRing);
        
        // --- Advanced: Camera Pulse effect on mouse move (light shift) ---
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
        });
        
        // --- Animation Variables ---
        let time = 0;
        
        // --- Animations Loop: All advanced movements ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // 1. Dynamic lighting color shift
            colorLightA.intensity = 0.55 + Math.sin(time * 1.7) * 0.25;
            colorLightB.intensity = 0.55 + Math.cos(time * 1.3) * 0.25;
            coreGlow.intensity = 0.9 + Math.sin(time * 2.1) * 0.4;
            rimLight.intensity = 0.7 + Math.sin(time * 1.9) * 0.3;
            fillLight.intensity = 0.6 + Math.cos(time * 1.2) * 0.2;
            
            // 2. Central objects rotation
            centralKnot.rotation.x += 0.008;
            centralKnot.rotation.y += 0.012;
            centralKnot.rotation.z += 0.005;
            innerCore.rotation.x += 0.005;
            innerCore.rotation.y += 0.007;
            swarmPoints.rotation.y += 0.01;
            swarmPoints.rotation.x = Math.sin(time * 0.7) * 0.1;
            
            // 3. Rune group rotation
            runeGroup.rotation.y += 0.008;
            runeGroup.rotation.x = Math.sin(time * 0.5) * 0.1;
            
            // 4. Member halo and ring rotations + floating effect
            membersList.forEach((m, idx) => {
                m.halo.rotation.z += 0.02;
                m.ring2.rotation.x += 0.015;
                m.ring2.rotation.y += 0.01;
                const floatY = Math.sin(time * 1.2 + idx) * 0.07;
                m.group.position.y = floatY;
            });
            
            // 5. Shimmer ring rotation & scale pulse
            shimmerRing.rotation.x += 0.01;
            shimmerRing.rotation.z += 0.005;
            shimmerRing.scale.setScalar(1 + Math.sin(time * 3) * 0.03);
            
            // 6. Energy orbs movement around center
            energyOrbs.forEach((orb, i) => {
                const angle = time * 1.5 + i * 0.5;
                const rad = 1.9;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                const y = Math.sin(angle * 2) * 0.5;
                orb.position.set(x, y + 0.2, z);
            });
            
            // 7. Flying line particles: interpolate between members positions
            const memberPositions = membersList.map(m => m.group.position.clone());
            if (memberPositions.length >= 3) {
                for (let i = 0; i < lineParticles.length; i++) {
                    const t = (time * 0.4 + i * 0.02) % 1;
                    const seg = Math.floor(t * 3) % 3;
                    const segT = (t * 3) % 1;
                    let p1, p2;
                    if (seg === 0) { p1 = memberPositions[0]; p2 = memberPositions[1]; }
                    else if (seg === 1) { p1 = memberPositions[1]; p2 = memberPositions[2]; }
                    else { p1 = memberPositions[2]; p2 = memberPositions[0]; }
                    const x = p1.x * (1 - segT) + p2.x * segT;
                    const z = p1.z * (1 - segT) + p2.z * segT;
                    const y = (p1.y + p2.y) / 2 + Math.sin(time * 5 + i) * 0.1;
                    lineParticles[i].position.set(x, y + 0.2, z);
                }
            }
            
            // 8. Starfield slow rotation
            starsField.rotation.y += 0.0003;
            starsField.rotation.x += 0.0002;
            dustCloud.rotation.y -= 0.0004;
            
            // 9. Floor ring pulsation
            floorRing.material.emissiveIntensity = 0.35 + Math.sin(time * 1.2) * 0.15;
            
            // 10. Mouse parallax effect on ambient rotation (slight)
            controls.target.lerp(new THREE.Vector3(mouseX * 0.2, mouseY * 0.1, 0), 0.05);
            
            // 11. CSS2D labels glow (implicit)
            // 12. Auto-rotate controlled by orbit controls (if not interacting)
            controls.update();
            
            // 13. Advanced bloom update
            effectComposer.render();
            
            // 14. CSS2D render
            labelRenderer.render(scene, camera);
        }
        
        // Start the animation
        animate();
        
        // Resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Console Easter egg
        console.log("%c🔥 GENZCTF ULTIMATE 3D NEXUS 🔥 | Ritesh | Nidhi | Mujahid | Next-Gen Cyber Core", "color: #0ff; font-size: 16px; font-family: monospace;");
        
        // Additional glow effect: add floating lens flare substitute (sprite)
        const lensSpriteMap = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(16, 16, 8, 0, 2 * Math.PI);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 16, 3, 0, 2 * Math.PI);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        })();
        const lensSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lensSpriteMap, blending: THREE.AdditiveBlending, color: 0x88aaff }));
        lensSprite.scale.set(0.5, 0.5, 1);
        scene.add(lensSprite);
        // animate lens flare to follow mouse?
        window.addEventListener('mousemove', (e) => {
            const v = new THREE.Vector3((e.clientX / window.innerWidth) * 2 - 1, (e.clientY / window.innerHeight) * -2 + 1, 0.5);
            v.unproject(camera);
            const dir = v.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            lensSprite.position.copy(pos);
        });
    </script>
</body>
</html>
