<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GenZCTF | Core Team</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* subtle UI hint */
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
            border-left: 2px solid rgba(100, 150, 255, 0.7);
        }

        /* elegant title overlay */
        .title {
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-weight: 500;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #eef, #aac);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            pointer-events: none;
            z-index: 10;
            font-family: 'Inter', monospace;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        @media (max-width: 700px) {
            .title { font-size: 0.9rem; letter-spacing: 2px; top: 16px; }
            .info { font-size: 9px; bottom: 12px; left: 12px; }
        }
    </style>
</head>
<body>
    <div class="title">GENZCTF — CORE NEXUS</div>
    <div class="info">✧ drag to orbit • scroll to zoom ✧</div>

    <!-- Import Three.js core and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- setup scene, camera, renderers ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.012); // very subtle fog for depth

        // camera: elegant framing
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4.5, 2.8, 6.5);
        camera.lookAt(0, 0.5, 0);

        // WebGL renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(0x0a0a1a, 1);
        document.body.appendChild(renderer.domElement);

        // CSS2 renderer for crisp, anti-aliased text labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- controls: smooth and non-intrusive ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enableZoom = true;
        controls.enablePan = false;        // keeps focus on the team
        controls.zoomSpeed = 1.0;
        controls.rotateSpeed = 1.2;
        controls.target.set(0, 0.6, 0);
        
        // --- lighting: soft, cinematic, shadow-ready ---
        // ambient fill
        const ambientLight = new THREE.AmbientLight(0x22223b, 0.65);
        scene.add(ambientLight);
        
        // key light (main directional)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 10;
        scene.add(mainLight);
        
        // fill light from below (warm, subtle)
        const fillLight = new THREE.PointLight(0x4a6fa5, 0.45);
        fillLight.position.set(0, -1.5, 0);
        scene.add(fillLight);
        
        // rim light (cool edge)
        const rimLight = new THREE.PointLight(0x7b8cd9, 0.6);
        rimLight.position.set(-2, 1.8, -3);
        scene.add(rimLight);
        
        // soft back rim
        const backRim = new THREE.PointLight(0x8a9bdc, 0.4);
        backRim.position.set(1, 1.2, -3.5);
        scene.add(backRim);
        
        // accent fill from right
        const accentFill = new THREE.PointLight(0x5f7fbf, 0.4);
        accentFill.position.set(2.5, 1.2, 1.8);
        scene.add(accentFill);
        
        // --- ground / reflective plane (invisible but receives shadows) ---
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 12),
            new THREE.ShadowMaterial({ opacity: 0.4, color: 0x000000, transparent: true, side: THREE.DoubleSide })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -1.2;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        // subtle grid helper (elegant reference)
        const gridHelper = new THREE.GridHelper(14, 28, 0x6c7a9e, 0x3c4466);
        gridHelper.position.y = -1.15;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        // decorative circular ring (minimal)
        const ringGeometry = new THREE.TorusGeometry(2.4, 0.05, 64, 200);
        const ringMaterial = new THREE.MeshStandardMaterial({ color: 0x8a9bdc, metalness: 0.7, roughness: 0.4, emissive: 0x1a2a4a, emissiveIntensity: 0.2 });
        const baseRing = new THREE.Mesh(ringGeometry, ringMaterial);
        baseRing.rotation.x = Math.PI / 2;
        baseRing.position.y = -1.1;
        scene.add(baseRing);
        
        // --- central abstract core (minimalistic geometric crystal) ---
        const centerGeo = new THREE.IcosahedronGeometry(0.65, 0);
        const centerMat = new THREE.MeshStandardMaterial({
            color: 0xbbc8ff,
            metalness: 0.85,
            roughness: 0.28,
            emissive: 0x111a33,
            emissiveIntensity: 0.15,
            flatShading: false
        });
        const centerCore = new THREE.Mesh(centerGeo, centerMat);
        centerCore.castShadow = true;
        centerCore.position.y = 0.2;
        scene.add(centerCore);
        
        // floating ring around central core (tiny accent)
        const innerRingGeo = new THREE.TorusGeometry(0.85, 0.03, 48, 120);
        const innerRingMat = new THREE.MeshStandardMaterial({ color: 0xcad2ff, metalness: 0.9, roughness: 0.3 });
        const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
        innerRing.rotation.x = Math.PI / 2;
        innerRing.rotation.z = Math.PI / 4;
        scene.add(innerRing);
        
        // --- team members data (elegant, minimal) ---
        const members = [
            { name: "Ritesh", role: "Lead Reverse Engineer", color: 0x5a7bc2, accent: "#5a7bc2" },
            { name: "Nidhi", role: "Cryptography & Web", color: 0x6c8fd9, accent: "#6c8fd9" },
            { name: "Mujahid", role: "Pwn & Forensics", color: 0x7f9fef, accent: "#7f9fef" }
        ];
        
        const orbitGroup = new THREE.Group();
        scene.add(orbitGroup);
        
        const radius = 3.0;
        const angles = [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3];
        const memberObjects = [];
        
        members.forEach((member, idx) => {
            const group = new THREE.Group();
            const angle = angles[idx];
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            group.position.set(x, 0, z);
            
            // sphere with refined material (metallic, slight roughness)
            const sphereGeo = new THREE.SphereGeometry(0.65, 96, 96);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: member.color,
                metalness: 0.78,
                roughness: 0.25,
                emissive: 0x111a33,
                emissiveIntensity: 0.12
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.castShadow = true;
            sphere.receiveShadow = false;
            group.add(sphere);
            
            // subtle ring around each sphere
            const haloGeo = new THREE.TorusGeometry(0.78, 0.03, 48, 100);
            const haloMat = new THREE.MeshStandardMaterial({ color: member.color, metalness: 0.9, roughness: 0.2 });
            const haloRing = new THREE.Mesh(haloGeo, haloMat);
            haloRing.rotation.x = Math.PI / 2;
            group.add(haloRing);
            
            // CSS2D label – clean glassmorphism, no neon
            const div = document.createElement('div');
            div.style.backgroundColor = 'rgba(18, 22, 40, 0.75)';
            div.style.backdropFilter = 'blur(12px)';
            div.style.borderRadius = '28px';
            div.style.padding = '10px 24px';
            div.style.border = `1px solid ${member.accent}80`;
            div.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05)';
            div.style.textAlign = 'center';
            div.style.fontFamily = "'Inter', system-ui, sans-serif";
            div.style.transition = 'transform 0.2s ease';
            div.innerHTML = `
                <div style="font-size: 1.45rem; font-weight: 600; letter-spacing: -0.2px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">${member.name}</div>
                <div style="font-size: 0.7rem; font-weight: 400; color: #cbd5ff; margin-top: 5px; letter-spacing: 0.3px;">${member.role}</div>
            `;
            const label = new CSS2DObject(div);
            label.position.set(0, 1.1, 0);
            group.add(label);
            
            orbitGroup.add(group);
            
            memberObjects.push({
                group,
                sphere,
                haloRing,
                floatSpeed: 0.8 + idx * 0.15,
                startY: 0
            });
        });
        
        // --- floating subtle particles (very few, just for depth) ---
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 12;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 4 + 0.5;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 12;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x8a9bdc, size: 0.045, transparent: true, opacity: 0.35 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);
        
        // --- starfield background (very distant, minimal) ---
        const starCount = 1200;
        const starFieldGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 180;
            starPositions[i*3+1] = (Math.random() - 0.5) * 90;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starFieldGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.4 });
        const stars = new THREE.Points(starFieldGeo, starMat);
        scene.add(stars);
        
        // --- simple animation loop (smooth, refined) ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.012;
            
            // gentle floating for team spheres
            memberObjects.forEach((obj, i) => {
                const offsetY = Math.sin(time * 1.2 + i) * 0.045;
                obj.group.position.y = offsetY;
                // rotate halo rings
                if (obj.haloRing) {
                    obj.haloRing.rotation.z += 0.008;
                    obj.haloRing.rotation.x = Math.sin(time * 0.9) * 0.2;
                }
            });
            
            // rotate central core elegantly
            centerCore.rotation.y += 0.003;
            centerCore.rotation.x += 0.002;
            innerRing.rotation.z += 0.005;
            innerRing.rotation.y += 0.004;
            baseRing.rotation.z += 0.002;
            
            // subtle rotation of the entire orbit group (very slow)
            orbitGroup.rotation.y += 0.0015;
            
            // particles and stars slight drift
            particles.rotation.y += 0.0005;
            stars.rotation.x += 0.0002;
            stars.rotation.y -= 0.0003;
            
            // dynamic light intensity variation (very subtle)
            const pulse = 0.1 + Math.sin(time * 0.7) * 0.05;
            accentFill.intensity = 0.4 + pulse * 0.1;
            rimLight.intensity = 0.55 + Math.sin(time * 0.9) * 0.08;
            
            // update controls (supports auto-rotate)
            controls.update();
            
            // render
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        animate();
        
        // handle window resize gracefully
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // small console greeting (polite)
        console.log('✨ GenZCTF — Core Team: Ritesh, Nidhi, Mujahid | refined 3D showcase');
    </script>
</body>
</html>
