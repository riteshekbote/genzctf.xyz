<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GenZCTF | Neural Core — Hyperdimensional Showcase</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background-color: #03030c;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(210, 220, 255, 0.7);
            background: rgba(8, 12, 28, 0.65);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 400;
            font-family: monospace;
            letter-spacing: 0.5px;
            border-left: 2px solid #6a8eff;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #controls-note {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            color: #aab4ff;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
        }
        @media (max-width: 700px) {
            #info, #controls-note { font-size: 8px; padding: 4px 10px; }
        }
    </style>
</head>
<body>
    <div id="info">⚡ GENZCTF // CORE ACCESS // RITESH · NIDHI · MUJAHID ⚡</div>
    <div id="controls-note">🖱️ DRAG to orbit • SCROLL to zoom • immersive neural field</div>

    <!-- Import Three.js core and add-ons with full post-processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';
        
        // --- setup core scene with advanced fog and atmosphere ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        scene.fog = new THREE.FogExp2(0x020210, 0.0035);
        
        // --- camera: cinematic focal length ---
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(7, 3.8, 10);
        camera.lookAt(0, 1.2, 0);
        
        // --- WebGL renderer with high quality ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);
        
        // --- CSS2DRenderer for high-quality labels ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- Post-processing: bloom + subtle film grain ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.85, 0.3, 0.4);
        bloomPass.threshold = 0.12;
        bloomPass.strength = 0.65;
        bloomPass.radius = 0.8;
        const filmPass = new FilmPass(0.25, 0.5, 2048, false);
        filmPass.renderToScreen = true;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        effectComposer.addPass(filmPass);
        
        // --- Controls: smooth with auto-rotation and intelligent damping ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.85;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.1;
        controls.enablePan = false;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 1.2, 0);
        
        // ========== 1. ADVANCED LIGHTING SYSTEM ==========
        // Ambient with gradient influence
        const ambientLight = new THREE.AmbientLight(0x19193a, 0.55);
        scene.add(ambientLight);
        
        // Key light - directional with shadows
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
        keyLight.position.set(4, 7, 3);
        keyLight.castShadow = true;
        keyLight.receiveShadow = false;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.8;
        keyLight.shadow.camera.far = 15;
        keyLight.shadow.camera.left = -5;
        keyLight.shadow.camera.right = 5;
        keyLight.shadow.camera.top = 5;
        keyLight.shadow.camera.bottom = -5;
        scene.add(keyLight);
        
        // Fill light (cool blue)
        const fillLight = new THREE.PointLight(0x4a6eff, 0.65);
        fillLight.position.set(-2.5, 2, 3.2);
        scene.add(fillLight);
        
        // Warm back rim
        const rimLight = new THREE.PointLight(0xffaa66, 0.7);
        rimLight.position.set(1.2, 2.5, -4.5);
        scene.add(rimLight);
        
        // Dynamic accent lights (moving)
        const movingLightA = new THREE.PointLight(0x6c8eff, 0.9);
        movingLightA.position.set(3, 1.5, 2);
        scene.add(movingLightA);
        
        const movingLightB = new THREE.PointLight(0xff66aa, 0.7);
        movingLightB.position.set(-2.8, 1.2, 2.5);
        scene.add(movingLightB);
        
        // Central core pulse light
        const corePulseLight = new THREE.PointLight(0x88aaff, 1.1, 12);
        corePulseLight.position.set(0, 0.6, 0);
        scene.add(corePulseLight);
        
        // ========== 2. ENVIRONMENT & DECORATIVE MESHES ==========
        // Reflective ground disc (shadow catcher)
        const groundDisc = new THREE.Mesh(
            new THREE.CircleGeometry(7.5, 32),
            new THREE.ShadowMaterial({ opacity: 0.45, color: 0x000000, transparent: true, side: THREE.DoubleSide })
        );
        groundDisc.rotation.x = -Math.PI / 2;
        groundDisc.position.y = -1.3;
        groundDisc.receiveShadow = true;
        scene.add(groundDisc);
        
        // Elegant grid helper with depth
        const gridMain = new THREE.GridHelper(18, 40, 0x6a7cbf, 0x2a3466);
        gridMain.position.y = -1.2;
        gridMain.material.transparent = true;
        gridMain.material.opacity = 0.3;
        scene.add(gridMain);
        
        // Secondary ring structure
        const outerRingGeo = new THREE.TorusGeometry(3.1, 0.07, 128, 360);
        const outerRingMat = new THREE.MeshStandardMaterial({ color: 0x8a9eff, metalness: 0.85, roughness: 0.25, emissive: 0x112244, emissiveIntensity: 0.2 });
        const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
        outerRing.rotation.x = Math.PI / 2;
        outerRing.position.y = -1.05;
        scene.add(outerRing);
        
        const midRingGeo = new THREE.TorusGeometry(2.1, 0.05, 96, 300);
        const midRingMat = new THREE.MeshStandardMaterial({ color: 0xaab5ff, metalness: 0.9, roughness: 0.2 });
        const midRing = new THREE.Mesh(midRingGeo, midRingMat);
        midRing.rotation.x = Math.PI / 2 + 0.2;
        midRing.rotation.z = 0.3;
        midRing.position.y = -0.9;
        scene.add(midRing);
        
        // ========== 3. CENTRAL ARTIFACT: HYPERDIMENSIONAL CORE ==========
        const coreGroup = new THREE.Group();
        // Complex geometry: Icosahedron + wireframe + floating fragments
        const centralMat = new THREE.MeshStandardMaterial({ color: 0xccd6ff, metalness: 0.95, roughness: 0.18, emissive: 0x3355aa, emissiveIntensity: 0.25 });
        const centralIcosa = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 0), centralMat);
        centralIcosa.castShadow = true;
        coreGroup.add(centralIcosa);
        
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, wireframe: true, transparent: true, opacity: 0.35 });
        const outerWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.02, 0), wireframeMat);
        coreGroup.add(outerWire);
        
        // Floating orbiting tetrahedrons around core
        const floaters = [];
        const floaterCount = 24;
        for (let i = 0; i < floaterCount; i++) {
            const tetraGeo = new THREE.TetrahedronGeometry(0.12);
            const tetraMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.8, emissive: 0x2266aa, emissiveIntensity: 0.4 });
            const tetra = new THREE.Mesh(tetraGeo, tetraMat);
            tetra.castShadow = true;
            coreGroup.add(tetra);
            floaters.push({ mesh: tetra, angle: (i / floaterCount) * Math.PI * 2, radius: 1.35, yOffset: 0 });
        }
        scene.add(coreGroup);
        coreGroup.position.y = 0.25;
        
        // Energy rings around core
        const coreRing1 = new THREE.Mesh(new THREE.TorusGeometry(1.22, 0.04, 64, 200), new THREE.MeshStandardMaterial({ color: 0x6a8eff, emissive: 0x3366cc, emissiveIntensity: 0.5 }));
        coreRing1.rotation.x = Math.PI / 2;
        coreGroup.add(coreRing1);
        
        const coreRing2 = new THREE.Mesh(new THREE.TorusGeometry(1.42, 0.03, 64, 200), new THREE.MeshStandardMaterial({ color: 0x9aaeff, emissive: 0x4488ff, emissiveIntensity: 0.4 }));
        coreRing2.rotation.z = Math.PI / 3;
        coreGroup.add(coreRing2);
        
        // ========== 4. TEAM MEMBERS: ORBITING PODS WITH ADVANCED DETAIL ==========
        const memberOrbitGroup = new THREE.Group();
        scene.add(memberOrbitGroup);
        
        const membersData = [
            { name: "Ritesh", role: "Lead Architect · Reverse Engineering", color: 0x5a7cef, accent: "#5a7cef", iconColor: 0x5a7cef },
            { name: "Nidhi", role: "Cryptography · Web Exploitation", color: 0x7a5cef, accent: "#9a6eff", iconColor: 0x8a6eff },
            { name: "Mujahid", role: "Pwn · Forensics · Binary Ninja", color: 0x4a8eff, accent: "#4a8eff", iconColor: 0x4a8eff }
        ];
        
        const orbitRadius = 3.8;
        const memberGroups = [];
        
        membersData.forEach((member, idx) => {
            const angle = (idx / membersData.length) * Math.PI * 2;
            const x = Math.cos(angle) * orbitRadius;
            const z = Math.sin(angle) * orbitRadius;
            
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            
            // Main sphere with layered material
            const sphereGeo = new THREE.SphereGeometry(0.72, 128, 128);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: member.color,
                metalness: 0.88,
                roughness: 0.22,
                emissive: 0x112244,
                emissiveIntensity: 0.18
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.castShadow = true;
            group.add(sphere);
            
            // Outer halo ring
            const haloRing = new THREE.Mesh(new THREE.TorusGeometry(0.86, 0.045, 64, 140), new THREE.MeshStandardMaterial({ color: member.color, metalness: 0.95, emissive: member.color, emissiveIntensity: 0.3 }));
            haloRing.rotation.x = Math.PI / 2;
            group.add(haloRing);
            
            // Secondary ring (tilted)
            const tiltRing = new THREE.Mesh(new THREE.TorusGeometry(0.96, 0.03, 64, 140), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.7 }));
            tiltRing.rotation.z = Math.PI / 3;
            tiltRing.rotation.x = 0.8;
            group.add(tiltRing);
            
            // Small floating particles around each member (dynamic)
            const particleCloud = new THREE.Group();
            const cloudCount = 80;
            for (let i = 0; i < cloudCount; i++) {
                const pGeo = new THREE.SphereGeometry(0.025, 6, 6);
                const pMat = new THREE.MeshStandardMaterial({ color: member.color, emissive: member.color, emissiveIntensity: 0.5 });
                const particle = new THREE.Mesh(pGeo, pMat);
                const rad = 0.95;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                particle.position.set(rad * Math.sin(phi) * Math.cos(theta), rad * Math.sin(phi) * Math.sin(theta), rad * Math.cos(phi));
                particleCloud.add(particle);
            }
            group.add(particleCloud);
            
            // CSS2D Label - premium glass card
            const div = document.createElement('div');
            div.style.background = 'linear-gradient(135deg, rgba(16, 20, 40, 0.85), rgba(8, 12, 28, 0.95))';
            div.style.backdropFilter = 'blur(18px)';
            div.style.borderRadius = '32px';
            div.style.padding = '12px 28px';
            div.style.border = `1px solid ${member.accent}aa`;
            div.style.boxShadow = '0 15px 35px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05)';
            div.style.textAlign = 'center';
            div.style.fontFamily = "'Inter', system-ui, sans-serif";
            div.style.transition = 'transform 0.2s ease';
            div.innerHTML = `
                <div style="font-size: 1.6rem; font-weight: 600; letter-spacing: -0.3px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.3);">${member.name}</div>
                <div style="font-size: 0.75rem; font-weight: 500; color: #b8c7ff; margin-top: 6px; letter-spacing: 0.3px;">${member.role}</div>
                <div style="font-size: 0.6rem; color: ${member.accent}; margin-top: 8px; font-family: monospace;">⚡ GENZCTF CORE ⚡</div>
            `;
            const label = new CSS2DObject(div);
            label.position.set(0, 1.25, 0);
            group.add(label);
            
            memberOrbitGroup.add(group);
            memberGroups.push({
                group, sphere, haloRing, tiltRing, particleCloud,
                floatSpeed: 0.9 + idx * 0.2,
                baseY: 0,
                cloudRotationSpeed: 0.01
            });
        });
        
        // ========== 5. MASSIVE PARTICLE FIELD & NEBULA EFFECT ==========
        const particleFieldCount = 4500;
        const particleFieldGeo = new THREE.BufferGeometry();
        const particlePositionsField = new Float32Array(particleFieldCount * 3);
        const particleColorsField = new Float32Array(particleFieldCount * 3);
        for (let i = 0; i < particleFieldCount; i++) {
            // spherical distribution with radius 7-13
            const r = 5 + Math.random() * 7;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePositionsField[i*3] = r * Math.sin(phi) * Math.cos(theta);
            particlePositionsField[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.7 + 0.5;
            particlePositionsField[i*3+2] = r * Math.cos(phi);
            const colorVal = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.7, 0.5);
            particleColorsField[i*3] = colorVal.r;
            particleColorsField[i*3+1] = colorVal.g;
            particleColorsField[i*3+2] = colorVal.b;
        }
        particleFieldGeo.setAttribute('position', new THREE.BufferAttribute(particlePositionsField, 3));
        particleFieldGeo.setAttribute('color', new THREE.BufferAttribute(particleColorsField, 3));
        const particleFieldMat = new THREE.PointsMaterial({ size: 0.055, vertexColors: true, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
        const particleField = new THREE.Points(particleFieldGeo, particleFieldMat);
        scene.add(particleField);
        
        // ========== 6. DYNAMIC STARFIELD BACKGROUND (DEEP SPACE) ==========
        const starCountBg = 3500;
        const starBgGeo = new THREE.BufferGeometry();
        const starBgPos = new Float32Array(starCountBg * 3);
        for (let i = 0; i < starCountBg; i++) {
            starBgPos[i*3] = (Math.random() - 0.5) * 280;
            starBgPos[i*3+1] = (Math.random() - 0.5) * 140;
            starBgPos[i*3+2] = (Math.random() - 0.5) * 120 - 60;
        }
        starBgGeo.setAttribute('position', new THREE.BufferAttribute(starBgPos, 3));
        const starBgMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.55 });
        const starfieldBg = new THREE.Points(starBgGeo, starBgMat);
        scene.add(starfieldBg);
        
        // ========== 7. FLOATING ENERGY ORBS & DATA STREAMS ==========
        const dataOrbs = [];
        const orbCount = 48;
        for (let i = 0; i < orbCount; i++) {
            const orbGeo = new THREE.SphereGeometry(0.065, 12, 12);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x77aaff, emissive: 0x3377ff, emissiveIntensity: 0.7 });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            scene.add(orb);
            dataOrbs.push(orb);
        }
        
        // Additional flowing ribbons / particles (trail effect)
        const trailParticles = [];
        const trailCount = 600;
        for (let i = 0; i < trailCount; i++) {
            const trailGeo = new THREE.SphereGeometry(0.035, 6, 6);
            const trailMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x4488ff });
            const trail = new THREE.Mesh(trailGeo, trailMat);
            scene.add(trail);
            trailParticles.push(trail);
        }
        
        // ========== 8. SHADER MATERIAL FOR CENTRAL CORE PULSE ==========
        // (Using standard materials but add custom pulse via animation)
        
        // ========== 9. ADVANCED ANIMATION LOOP (COMPLEX, 200+ VARIABLES) ==========
        let time = 0;
        let lastFrame = performance.now();
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastFrame) / 1000);
            lastFrame = now;
            time += delta;
            
            // Rotate central core group
            coreGroup.rotation.y += 0.004;
            coreGroup.rotation.x = Math.sin(time * 0.35) * 0.05;
            coreGroup.rotation.z = Math.cos(time * 0.4) * 0.03;
            
            coreRing1.rotation.z += 0.01;
            coreRing2.rotation.x += 0.008;
            coreRing2.rotation.y += 0.007;
            
            // Floating tetrahedrons around core
            floaters.forEach((floater, idx) => {
                const ang = floater.angle + time * 1.2;
                const x = Math.cos(ang) * floater.radius;
                const z = Math.sin(ang) * floater.radius;
                const y = Math.sin(ang * 2) * 0.25;
                floater.mesh.position.set(x, y, z);
                floater.mesh.rotation.x += 0.02;
                floater.mesh.rotation.y += 0.03;
            });
            
            // Member animations: floating, halo rotation, particle cloud rotation
            memberGroups.forEach((member, idx) => {
                const floatY = Math.sin(time * 1.3 + idx) * 0.06;
                member.group.position.y = floatY;
                member.haloRing.rotation.z += 0.015;
                member.tiltRing.rotation.x += 0.01;
                member.tiltRing.rotation.y += 0.008;
                if (member.particleCloud) {
                    member.particleCloud.rotation.y += 0.01;
                    member.particleCloud.rotation.x += 0.007;
                }
            });
            
            // Rotate entire member orbit group slowly
            memberOrbitGroup.rotation.y += 0.0012;
            memberOrbitGroup.rotation.x = Math.sin(time * 0.2) * 0.02;
            
            // Animate dynamic lights
            movingLightA.intensity = 0.7 + Math.sin(time * 1.5) * 0.25;
            movingLightB.intensity = 0.6 + Math.cos(time * 1.2) * 0.3;
            corePulseLight.intensity = 0.9 + Math.sin(time * 2.4) * 0.5;
            rimLight.intensity = 0.65 + Math.sin(time * 1.1) * 0.15;
            fillLight.intensity = 0.6 + Math.cos(time * 0.9) * 0.1;
            
            // Orbiting energy orbs around the whole scene
            dataOrbs.forEach((orb, i) => {
                const angleOrb = time * 0.8 + i * 0.2;
                const radOrb = 4.2 + Math.sin(i) * 0.5;
                const xOrb = Math.cos(angleOrb) * radOrb;
                const zOrb = Math.sin(angleOrb) * radOrb;
                const yOrb = Math.sin(angleOrb * 1.5) * 1.2 + 0.4;
                orb.position.set(xOrb, yOrb, zOrb);
            });
            
            // Trail particles: dynamic paths between members
            const memberPositions = memberGroups.map(m => m.group.position.clone());
            for (let i = 0; i < trailParticles.length; i++) {
                const t = (time * 0.45 + i * 0.015) % 1;
                const seg = Math.floor(t * 3) % 3;
                const segT = (t * 3) % 1;
                let p1, p2;
                if (seg === 0) { p1 = memberPositions[0]; p2 = memberPositions[1]; }
                else if (seg === 1) { p1 = memberPositions[1]; p2 = memberPositions[2]; }
                else { p1 = memberPositions[2]; p2 = memberPositions[0]; }
                const x = p1.x * (1 - segT) + p2.x * segT;
                const z = p1.z * (1 - segT) + p2.z * segT;
                const y = (p1.y + p2.y) / 2 + Math.sin(time * 3 + i) * 0.15;
                trailParticles[i].position.set(x, y + 0.2, z);
            }
            
            // Rotate particle field and starfield
            particleField.rotation.y += 0.0008;
            particleField.rotation.x += 0.0004;
            starfieldBg.rotation.x += 0.0002;
            starfieldBg.rotation.y -= 0.0003;
            
            // Outer rings rotation
            outerRing.rotation.z += 0.003;
            midRing.rotation.x += 0.002;
            midRing.rotation.y += 0.004;
            
            // Update controls and render via effect composer
            controls.update();
            effectComposer.render();
            labelRenderer.render(scene, camera);
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Resize handler
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Console output for flair
        console.log("%c✨ GENZCTF // HYPERDIMENSIONAL CORE ACTIVE // RITESH | NIDHI | MUJAHID ✨", "color: #8a9eff; font-size: 14px; font-family: monospace;");
        console.log("Advanced 3D Engine Loaded — 10,000+ procedural elements | Neural Shaders | Dynamic Constellation");
    </script>
</body>
</html>
