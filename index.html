<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GENZCTF | Security Researcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #020617; /* deep navy background */
      color: #e5e7eb;      /* light gray text for contrast */
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .terminal {
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }

    .title {
      font-size: 46px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #00ff9c; /* accent green */
      text-shadow: 0 0 8px #00ff9c;
    }

    .subtitle {
      color: #9ca3af;
      margin-top: 6px;
      font-size: 14px;
    }

    .type {
      font-size: 16px;
      white-space: pre-line;
      line-height: 1.8;
      margin-top: 30px;
      color: #e5e7eb;
    }

    .highlight {
      color: #00ff9c;
    }

    .cursor::after {
      content: "_";
      animation: blink 1s infinite;
      color: #00ff9c;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="terminal">
  <div class="title">GENZCTF</div>
  <div class="subtitle">Independent Security Researcher</div>

  <div class="type cursor" id="type"></div>
</div>

<script>
const text = `
[ Initializing Research Environment... ]
[ Loading Web Security Modules... ]
[ Passive Recon Complete... ]

Name            : Ritesh Ekbote
Alias           : GENZCTF
Role            : Security Researcher | Bug Bounty Hunter
Focus Areas     : Web Exploitation, Clickjacking, Auth Issues, Recon
Experience      : CTFs, Responsible Disclosure, Vulnerability Research

Contact:
Email           : riteshekbote@gmail.com
LinkedIn        : linkedin.com/in/uml0zxnorwtib3rl
Website         : https://genzctf.xyz
`;

let i = 0;
function typeWriter() {
  if (i < text.length) {
    document.getElementById("type").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 26);
  }
}
typeWriter();

// Subtle Matrix Background
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function draw() {
  ctx.fillStyle = "rgba(2, 6, 23, 0.12)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff9c";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 50);
</script>

</body>
</html>
