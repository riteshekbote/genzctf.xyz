<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GenZCTF | 3D Core Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Small UI hint for orbit controls */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
            border-left: 3px solid #00f2ff;
        }

        /* Optional: a subtle loading indicator, but not needed */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* CSS2D labels styling (glassmorphic cards) */
        .member-label {
            background: rgba(12, 20, 35, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 24px;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 242, 255, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3), 0 0 15px rgba(0,242,255,0.2);
            transition: transform 0.2s ease;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }
        
        .member-label:hover {
            transform: scale(1.05);
            border-color: #00f2ff;
            box-shadow: 0 0 25px rgba(0,242,255,0.5);
        }
        
        .member-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #aaffff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        
        .member-role {
            font-size: 0.75rem;
            font-weight: 400;
            color: #b0e0ff;
            margin-top: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }
        
        .title-label {
            background: linear-gradient(135deg, rgba(0,0,0,0.6), rgba(0,20,40,0.8));
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 16px 36px;
            border: 1px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.3);
            text-align: center;
            white-space: nowrap;
        }
        
        .title-name {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #00f2ff, #ff00e0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 3px;
        }
        
        .title-tag {
            font-size: 0.7rem;
            color: #ccddff;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        
        @media (max-width: 700px) {
            .member-label { padding: 8px 16px; white-space: nowrap; transform: scale(0.85); }
            .member-name { font-size: 1rem; }
            .title-name { font-size: 1.4rem; }
            .title-label { padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <div class="controls-hint">✨ Drag to orbit • GenZCTF Core ✨</div>

    <!-- Import Three.js core and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Setup Scene, Camera, Renderers ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008); // subtle fog for depth

        // Camera: positioned for dramatic view
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);
        camera.lookAt(0, 0, 0);

        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // shadows for depth
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2 Renderer for high-quality text labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // allow clicking through to canvas
        document.body.appendChild(labelRenderer.domElement);

        // --- Controls for interactivity ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;      // smooth inertia
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.target.set(0, 0.5, 0);

        // --- Lighting System (rich and dramatic) ---
        // Ambient fill
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        
        // Main directional light (shadow casting)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        
        // Fill light from below (cyber glow)
        const fillLight = new THREE.PointLight(0x2266ff, 0.5);
        fillLight.position.set(0, -2, 0);
        scene.add(fillLight);
        
        // Back rim light
        const rimLight = new THREE.PointLight(0xff44aa, 0.6);
        rimLight.position.set(-2, 1, -3);
        scene.add(rimLight);
        
        // Dynamic moving colored lights for energy
        const colorLight1 = new THREE.PointLight(0xff00cc, 0.4);
        colorLight1.position.set(2, 1, 2);
        scene.add(colorLight1);
        
        const colorLight2 = new THREE.PointLight(0x00ccff, 0.4);
        colorLight2.position.set(-2, 1.5, 2.5);
        scene.add(colorLight2);
        
        // Central glow point light
        const coreGlow = new THREE.PointLight(0x3399ff, 0.8, 8);
        coreGlow.position.set(0, 0.2, 0);
        scene.add(coreGlow);
        
        // --- Helper: Particle Starfield (background depth) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // --- Central 3D Artifact: Glowing Torus Knot + Icosahedron Core (representing CTF spirit)---
        const knotGeo = new THREE.TorusKnotGeometry(1.1, 0.28, 180, 24, 3, 4);
        const knotMat = new THREE.MeshStandardMaterial({
            color: 0x3a86ff,
            emissive: 0x113366,
            emissiveIntensity: 0.7,
            metalness: 0.85,
            roughness: 0.25,
            flatShading: false
        });
        const knot = new THREE.Mesh(knotGeo, knotMat);
        knot.castShadow = true;
        knot.receiveShadow = false;
        scene.add(knot);
        
        // Inner crystal core (icosahedron)
        const coreGeo = new THREE.IcosahedronGeometry(0.65, 0);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            emissive: 0x2266aa,
            emissiveIntensity: 0.5,
            metalness: 0.7,
            roughness: 0.3,
            transparent: true,
            opacity: 0.95
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.castShadow = true;
        scene.add(coreMesh);
        
        // Outer wireframe shell for extra style
        const wireframeGeo = new THREE.IcosahedronGeometry(0.82, 0);
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x44ccff, wireframe: true, transparent: true, opacity: 0.35 });
        const wireframeShell = new THREE.Mesh(wireframeGeo, wireframeMat);
        scene.add(wireframeShell);
        
        // Floating particles ring around center
        const particleRingCount = 400;
        const ringGeo = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(particleRingCount * 3);
        for (let i = 0; i < particleRingCount; i++) {
            const angle = (i / particleRingCount) * Math.PI * 2;
            const radius = 1.9;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = Math.sin(angle * 2) * 0.25;
            ringPositions[i*3] = x;
            ringPositions[i*3+1] = y;
            ringPositions[i*3+2] = z;
        }
        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        const ringParticlesMat = new THREE.PointsMaterial({ color: 0x44aaff, size: 0.05, transparent: true, blending: THREE.AdditiveBlending });
        const ringParticles = new THREE.Points(ringGeo, ringParticlesMat);
        scene.add(ringParticles);
        
        // --- Create 3 Members with CSS2D Labels (Glass Cards)---
        // Define team members data
        const members = [
            { name: "Ritesh", role: "Team Captain • Reverse Engineering", color: 0x3a86ff, accent: "#3a86ff" },
            { name: "Nidhi", role: "Cryptography • Web Exploitation", color: 0xff006e, accent: "#ff006e" },
            { name: "Mujahid", role: "Pwn • Forensics Master", color: 0x9c27b0, accent: "#b94eff" }
        ];
        
        // Orbit group that will rotate the members around center
        const orbitGroup = new THREE.Group();
        scene.add(orbitGroup);
        
        const radius = 3.2;
        const angles = [0, (Math.PI * 2) / 3, (Math.PI * 4) / 3];
        
        // Store member groups for potential animation (pulse)
        const memberMeshes = [];
        
        members.forEach((member, idx) => {
            // Create a group for each member (sphere + label container)
            const memberGroup = new THREE.Group();
            const angle = angles[idx];
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            memberGroup.position.set(x, 0, z);
            
            // 3D Sphere with emissive rim
            const sphereGeo = new THREE.SphereGeometry(0.58, 64, 64);
            const sphereMat = new THREE.MeshStandardMaterial({
                color: member.color,
                emissive: member.color,
                emissiveIntensity: 0.25,
                metalness: 0.7,
                roughness: 0.2,
                flatShading: false
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.castShadow = true;
            sphere.receiveShadow = false;
            memberGroup.add(sphere);
            
            // Add a small orbiting ringlet around each sphere (decorative)
            const ringletGeo = new THREE.TorusGeometry(0.72, 0.04, 32, 100);
            const ringletMat = new THREE.MeshStandardMaterial({ color: member.color, emissive: member.color, emissiveIntensity: 0.4 });
            const ringlet = new THREE.Mesh(ringletGeo, ringletMat);
            ringlet.rotation.x = Math.PI / 2;
            ringlet.rotation.z = Date.now() * 0.005;
            memberGroup.add(ringlet);
            
            // CSS2D Label (beautiful glass card)
            const div = document.createElement('div');
            div.className = 'member-label';
            div.innerHTML = `
                <div class="member-name">${member.name}</div>
                <div class="member-role">${member.role}</div>
            `;
            const label = new CSS2DObject(div);
            label.position.set(0, 1.15, 0); // float above sphere
            memberGroup.add(label);
            
            // Store reference for subtle animation
            memberMeshes.push({ sphere, ringlet, label, originalY: 0, floatSpeed: 0.5 + idx * 0.2 });
            
            orbitGroup.add(memberGroup);
        });
        
        // --- Additional CSS2D Title: "GenZCTF" in the center above the knot ---
        const titleDiv = document.createElement('div');
        titleDiv.className = 'title-label';
        titleDiv.innerHTML = `
            <div class="title-name">GENZCTF</div>
            <div class="title-tag">CYBER TASK FORCE</div>
        `;
        const titleLabel = new CSS2DObject(titleDiv);
        titleLabel.position.set(0, 1.8, 0);
        scene.add(titleLabel);
        
        // --- Floating Particles Field (enhancing 3D depth)---
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            // Distribute in a sphere radius 6
            const radiusP = 4 + Math.random() * 3.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePositions[i*3] = radiusP * Math.sin(phi) * Math.cos(theta);
            particlePositions[i*3+1] = radiusP * Math.sin(phi) * Math.sin(theta) * 0.8;
            particlePositions[i*3+2] = radiusP * Math.cos(phi);
            
            const colorChoice = Math.random() > 0.6 ? new THREE.Color(0x88aaff) : new THREE.Color(0xff66cc);
            particleColors[i*3] = colorChoice.r;
            particleColors[i*3+1] = colorChoice.g;
            particleColors[i*3+2] = colorChoice.b;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const ambientParticles = new THREE.Points(particleGeo, particleMat);
        scene.add(ambientParticles);
        
        // --- Decorative Ground Glow Ring (ethereal)---
        const glowRingGeo = new THREE.RingGeometry(2.8, 4.2, 32);
        const glowRingMat = new THREE.MeshStandardMaterial({
            color: 0x2266aa,
            emissive: 0x1166aa,
            emissiveIntensity: 0.3,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const groundRing = new THREE.Mesh(glowRingGeo, glowRingMat);
        groundRing.rotation.x = -Math.PI / 2;
        groundRing.position.y = -1.2;
        scene.add(groundRing);
        
        // Additional tiny floating orbs around center (energy orbs)
        const energyOrbs = [];
        for (let i = 0; i < 12; i++) {
            const orbGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x44ccff, emissive: 0x44aaff, emissiveIntensity: 0.8 });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            scene.add(orb);
            energyOrbs.push(orb);
        }
        
        // --- Animation Variables ---
        let time = 0;
        
        // Simple helper to animate rotating ringlet for each member
        function animateMemberRinglets() {
            memberMeshes.forEach((item, idx) => {
                if (item.ringlet) {
                    item.ringlet.rotation.z += 0.02;
                    item.ringlet.rotation.x = Math.sin(time * 1.5 + idx) * 0.3;
                }
                // Gentle floating effect for sphere (vertical bob)
                if (item.sphere) {
                    const floatY = Math.sin(time * 1.2 + idx) * 0.05;
                    item.sphere.position.y = floatY;
                    // label also follows with same offset but label is child of memberGroup, no need to adjust label y separately
                }
            });
        }
        
        // Rotate the entire orbit group for dynamic feel
        let orbitRotationSpeed = 0.0025;
        
        // --- Animate dynamic lights & central objects ---
        function animateLights() {
            colorLight1.intensity = 0.45 + Math.sin(time * 1.8) * 0.2;
            colorLight2.intensity = 0.45 + Math.cos(time * 1.5) * 0.2;
            coreGlow.intensity = 0.7 + Math.sin(time * 2.2) * 0.3;
            rimLight.intensity = 0.5 + Math.sin(time * 1.2) * 0.2;
        }
        
        // --- Central objects rotation ---
        function animateCenter() {
            knot.rotation.x += 0.005;
            knot.rotation.y += 0.008;
            knot.rotation.z += 0.003;
            coreMesh.rotation.x += 0.003;
            coreMesh.rotation.y += 0.007;
            wireframeShell.rotation.x += 0.004;
            wireframeShell.rotation.y += 0.006;
            ringParticles.rotation.y += 0.01;
            ringParticles.rotation.x = Math.sin(time * 0.5) * 0.1;
        }
        
        // Animate the orbiting group of members
        function animateOrbit() {
            orbitGroup.rotation.y += orbitRotationSpeed;
            // slight tilt for dramatic effect
            orbitGroup.rotation.x = Math.sin(time * 0.2) * 0.05;
            orbitGroup.rotation.z = Math.cos(time * 0.23) * 0.03;
        }
        
        // Stars slow drift
        function animateStars() {
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            ambientParticles.rotation.y -= 0.0002;
            ambientParticles.rotation.x += 0.0001;
        }
        
        // Energy orbs moving around central knot
        function animateEnergyOrbs() {
            energyOrbs.forEach((orb, i) => {
                const angle = time * 1.2 + i * Math.PI * 2 / energyOrbs.length;
                const radiusOrb = 1.6;
                const x = Math.cos(angle) * radiusOrb;
                const z = Math.sin(angle) * radiusOrb;
                const y = Math.sin(angle * 2) * 0.5;
                orb.position.set(x, y + 0.2, z);
            });
        }
        
        // Adjust camera and renderers on window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Simple floating title effect
        let titleBob = 0;
        
        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016; // smooth increment
            
            // Update various animations
            animateMemberRinglets();
            animateLights();
            animateCenter();
            animateOrbit();
            animateStars();
            animateEnergyOrbs();
            
            // Gentle floating for the title label
            titleLabel.position.y = 1.8 + Math.sin(time * 1.5) * 0.05;
            
            // Slight rotation of ground ring
            groundRing.rotation.z += 0.003;
            
            // Update controls (for smooth damping)
            controls.update(); // only updates if damping or autoRotate, but we call to apply changes
            
            // Render WebGL content
            renderer.render(scene, camera);
            // Render CSS2D labels (always face camera)
            labelRenderer.render(scene, camera);
        }
        
        // Start animation
        animate();
        
        // Additional small effect: Console greeting for CTF style
        console.log("%c⚡ GenZCTF 3D Interface Loaded | Core: Ritesh, Nidhi, Mujahid ⚡", "color: #00f2ff; font-size: 14px; font-family: monospace;");
        
        // Small interactive tweak: Make CSS2D labels slightly interactive (pointer events auto for links? but not needed)
        // Add a subtle background shimmer effect via CSS (global style already)
    </script>
</body>
</html>
